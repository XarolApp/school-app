<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Databáze pražských středních škol. Porovnej obory, přijímačky a lokalitu na jednom místě." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <title>ŠkolaMatch — najdi svou střední školu v Praze</title>
    <!--
      Applies the saved theme before the first paint. React sets this same
      attribute once it mounts, but that is several hundred milliseconds too
      late: without this the page flashes light before snapping to dark.
      The key must match STORAGE_KEY in src/components/ThemeContext.jsx.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('skolamatch.theme');
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (e) {
          /* Private browsing — fall back to the OS preference. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
