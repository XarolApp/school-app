<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      try {
        const cached = JSON.parse(localStorage.getItem('skolamatch.theme') || 'null');
        const palettes = ['znacka', 'smrk', 'zvyraznovac', 'terakota'];
        const modes = ['system', 'light', 'dark'];
        const palette = palettes.includes(cached?.palette) ? cached.palette : 'znacka';
        const mode = modes.includes(cached?.mode) ? cached.mode : 'system';
        if (palette === 'znacka') document.documentElement.removeAttribute('data-palette');
        else document.documentElement.setAttribute('data-palette', palette);
        if (mode === 'system') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', mode);
      } catch {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>ŠkolaMatch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
