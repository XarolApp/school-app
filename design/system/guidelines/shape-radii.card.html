<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface);font-family:var(--font-sans);color:var(--on-surface)}.g{display:flex;gap:14px;align-items:flex-end}.b{background:var(--neutral);border:1px solid var(--border);height:64px;flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;font-weight:600;color:var(--secondary)}</style></head><body><div class="g"><div class="b" style="border-radius:var(--radius-input)">input 10</div><div class="b" style="border-radius:var(--radius-chip)">chip 12</div><div class="b" style="border-radius:var(--radius-button)">button 12</div><div class="b" style="border-radius:var(--radius-card)">card 20</div><div class="b" style="border-radius:var(--radius-full)">full</div></div></body></html>
