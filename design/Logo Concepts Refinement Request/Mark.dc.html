<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 64 64" width="100%" height="100%" style="display:block" fill="none">
  <sc-if value="{{ isFit }}" hint-placeholder-val="{{ true }}">
    <g fill="currentColor">
      <path d="M10,14 H30 V24 A8,8 0 0 0 30,40 V50 H10 Z"></path>
      <path d="M34,24 A8,8 0 0 0 34,40 V50 H54 V14 H34 Z"></path>
    </g>
  </sc-if>
  <sc-if value="{{ isRoof }}" hint-placeholder-val="{{ false }}">
    <g stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13,33 L32,16 L51,33"></path>
    </g>
    <circle cx="32" cy="45" r="6" fill="currentColor"></circle>
  </sc-if>
  <sc-if value="{{ isRule }}" hint-placeholder-val="{{ false }}">
    <g fill="currentColor">
      <rect x="9" y="47" width="46" height="6" rx="3"></rect>
      <rect x="14" y="34" width="5" height="9" rx="2.5"></rect>
      <rect x="22" y="28" width="5" height="15" rx="2.5"></rect>
      <rect x="29.5" y="15" width="6" height="28" rx="3"></rect>
      <rect x="38" y="28" width="5" height="15" rx="2.5"></rect>
      <rect x="46" y="34" width="5" height="9" rx="2.5"></rect>
    </g>
  </sc-if>
  <sc-if value="{{ isRing }}" hint-placeholder-val="{{ false }}">
    <circle cx="32" cy="32" r="20" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-dasharray="30.4 11.5" transform="rotate(-70 32 32)"></circle>
    <circle cx="32" cy="32" r="6" fill="currentColor"></circle>
  </sc-if>
  <sc-if value="{{ isCheck }}" hint-placeholder-val="{{ false }}">
    <path d="M14,31 L27,44 L50,18" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path>
  </sc-if>
  <sc-if value="{{ isFork }}" hint-placeholder-val="{{ false }}">
    <path d="M32,38 L17,22" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.4"></path>
    <path d="M32,54 V37 L48,19" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
  </sc-if>
  <sc-if value="{{ isFrame }}" hint-placeholder-val="{{ false }}">
    <g stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M25,14 H14 V50 H25"></path>
      <path d="M39,14 H50 V50 H39"></path>
    </g>
    <circle cx="32" cy="32" r="7" fill="currentColor"></circle>
  </sc-if>
  <sc-if value="{{ isMonogram }}" hint-placeholder-val="{{ false }}">
    <text x="32" y="45" text-anchor="middle" font-family="Lora, Georgia, serif" font-style="italic" font-weight="600" font-size="42" fill="currentColor">sm</text>
  </sc-if>
  <sc-if value="{{ isMonogram2 }}" hint-placeholder-val="{{ false }}">
    <text x="32" y="45" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-style="italic" font-weight="500" font-size="44" fill="currentColor">sm</text>
  </sc-if>
  <sc-if value="{{ isLetter }}" hint-placeholder-val="{{ false }}">
    <text x="32" y="45" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-weight="400" font-size="52" fill="currentColor">Š</text>
    <path d="M11,55 Q32,63 53,49" stroke="currentColor" stroke-width="5" stroke-linecap="round"></path>
  </sc-if>
  <sc-if value="{{ isLetter2 }}" hint-placeholder-val="{{ false }}">
    <text x="32" y="44" text-anchor="middle" font-family="Lora, Georgia, serif" font-style="italic" font-weight="600" font-size="48" fill="currentColor">Š</text>
    <path d="M11,55 Q32,63 53,49" stroke="currentColor" stroke-width="5" stroke-linecap="round"></path>
  </sc-if>
  <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
    <g fill="currentColor">
      <rect x="10" y="14" width="44" height="11" rx="5.5"></rect>
      <rect x="10" y="30" width="31" height="11" rx="5.5" opacity="0.38"></rect>
      <rect x="10" y="46" width="20" height="11" rx="5.5" opacity="0.38"></rect>
    </g>
  </sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fit&quot;,&quot;roof&quot;,&quot;rule&quot;,&quot;ring&quot;,&quot;check&quot;,&quot;fork&quot;,&quot;frame&quot;,&quot;list&quot;,&quot;monogram&quot;,&quot;monogram2&quot;,&quot;letter&quot;,&quot;letter2&quot;],&quot;default&quot;:&quot;fit&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || "fit";
    return {
      isFit: k === "fit", isRoof: k === "roof", isRule: k === "rule", isRing: k === "ring",
      isCheck: k === "check", isFork: k === "fork", isFrame: k === "frame", isList: k === "list",
      isMonogram: k === "monogram", isMonogram2: k === "monogram2", isLetter: k === "letter", isLetter2: k === "letter2"
    };
  }
}
</script>
</body>
</html>
